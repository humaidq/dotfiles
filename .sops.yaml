keys:
  - &oreamnos age1p75e7j6vzfcexheyzztpy7yklrxwt3vh4wrlakmttvc7ry042veqn0pq78
  - &serow age17va7vnasx8e9dtfvfxcd8epzmc87renc4f7t357m4xaqu7qp24wsgcztj6
  - &anoa age1ec70anc9j3tt7r2t24t9gchpf3c5hm6k9drx43v9wmn5xyvzfufs3repxd
  - &bongo age1tnl79m5zk9myngmaxvy2znt7rueeup9v8e760y9z3vsdk2650unqm0ckx8
  - &duisk age1pj6s2egqvseryr3eu7xhzuqdmnf3hsghp3fr6z48haptzlmggyvqvhg9v5
  - &lighthouse age19f88hjgpf3v22vpnv4tf62vzcapcjlzrt08h3pt29tgddacqlevsn8trmq
  - &bingo age1swvwwcz00rukxfxkfq2m08gqq4jj0j2n04vcpnlxgwcm2n7qjq4stgg2u2
  - &hisn age1tat3vf5uj0k6s78llc7eqct9d9h9u26fhw5ggzj9aank7g2gwp5q943qvn
creation_rules:
  # Every host belongs here, not just the ones that obviously want a shared
  # secret: this file carries user-passwd, and modules/personal/secrets.nix
  # points hashedPasswordFile at it for the primary user on every host that is
  # not in bootstrap mode. A host missing from this list boots with no password
  # hash, and since mutableUsers is false and PermitRootLogin is no, it cannot
  # be escalated on from the console either — the only ways back are
  # `init=/bin/sh` at the bootloader or a reinstall. Add a new host here at the
  # same time as its own secrets file, before its first boot.
  - path_regex: secrets/all.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *serow
          - *anoa
          - *bongo
          - *duisk
          - *lighthouse
          - *bingo
          - *hisn
  - path_regex: secrets/duisk.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *duisk
  - path_regex: secrets/bongo.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *bongo
  - path_regex: secrets/bingo.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *bingo
  - path_regex: secrets/lighthouse.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *serow
          - *lighthouse
  # hisn's key is derived from an ssh host key generated here and handed to the
  # installer, rather than from one the host generated for itself. The ordering
  # is the point: sops-nix decrypts using /etc/ssh/ssh_host_ed25519_key, and
  # hisn's nebula certificate is a sops secret. A host keyed only after it
  # first boots therefore comes up with no certificate, and since the ssh
  # daemon here is not opened to the WAN, with no mesh and no way in either.
  # Pre-generating the key closes that window.
  - path_regex: secrets/hisn.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *serow
          - *hisn
  - path_regex: secrets/home-server.yaml$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *serow
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *oreamnos
          - *anoa
          - *serow
